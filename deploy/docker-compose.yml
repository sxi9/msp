# MSP server stack. Run from the repository root or from deploy/:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# First-time bootstrap (creates the first admin, an org and an enrollment token):
#   docker compose -f deploy/docker-compose.yml run --rm server user add --email admin@example.com --role admin --password-stdin
#   docker compose -f deploy/docker-compose.yml run --rm server org add --name "Acme Dental"
#   docker compose -f deploy/docker-compose.yml run --rm server token new --org 1 --label rollout --max-uses 10 --ttl 168h
#
# ./data (next to this file) holds msp.db plus its -wal/-shm files. The container runs as
# uid 10001, so create the directory with matching ownership before the first start:
#   mkdir -p deploy/data && sudo chown 10001:10001 deploy/data
#
# Plain HTTP on :8080 is the lab default. For production uncomment the caddy service below,
# copy Caddyfile.example to Caddyfile with your hostname, remove the server "ports" mapping
# (Caddy reaches the server on the compose network), and start with
#   MSP_BASE_URL=https://rmm.example.com MSP_SECURE_COOKIES=1 MSP_TRUST_PROXY=1 docker compose ... up -d
# or put those three lines in a .env file next to this compose file.

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: msp-server:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      # Command preset library (the "Presets…" dropdown of the device console). Copy
      # presets.example.json to deploy/presets.json, edit it, mount it and set MSP_PRESETS
      # below; edits are picked up live, no restart needed (docs/OPS.md section 1).
      # - ./presets.json:/data/presets.json:ro
    environment:
      # Absolute URL technicians and agents use to reach the server; printed into the
      # install one-liners next to every enrollment token.
      MSP_BASE_URL: ${MSP_BASE_URL:-http://localhost:8080}
      # 1 when the public URL is https (Caddy or any TLS terminator in front).
      MSP_SECURE_COOKIES: ${MSP_SECURE_COOKIES:-0}
      # 1 only behind a reverse proxy you control: honours the first X-Forwarded-For hop
      # for rate limits and the audit log. Never 1 when :8080 is reachable directly.
      MSP_TRUST_PROXY: ${MSP_TRUST_PROXY:-0}
      MSP_RETENTION_DAYS: ${MSP_RETENTION_DAYS:-7}
      # Uncomment together with the presets.json volume above.
      # MSP_PRESETS: /data/presets.json

  # Automatic HTTPS with Let's Encrypt. Requires a public DNS name pointing at this host and
  # ports 80 + 443 reachable from the internet (HTTP-01 challenge). With Caddy in front set
  # MSP_BASE_URL=https://rmm.example.com, MSP_SECURE_COOKIES=1 and MSP_TRUST_PROXY=1 on the
  # server service, and drop the server's "ports" block so only Caddy is exposed.
  #
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - server

