# MSP server stack. Run from the repository root or from deploy/:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# First-time bootstrap (creates the first admin, an org and an enrollment token):
#   docker compose -f deploy/docker-compose.yml run --rm server user add --email admin@example.com --role admin --password-stdin
#   docker compose -f deploy/docker-compose.yml run --rm server org add --name "Acme Dental"
#   docker compose -f deploy/docker-compose.yml run --rm server token new --org 1 --label rollout --max-uses 10 --ttl 168h
#
# ./data (next to this file) holds msp.db plus its -wal/-shm files. The container runs as
# uid 10001, so create the directory with matching ownership before the first start:
#   mkdir -p deploy/data && sudo chown 10001:10001 deploy/data
#
# Plain HTTP on :8080 is the lab default. For production uncomment the caddy service below,
# copy Caddyfile.example to Caddyfile with your hostname, remove the server "ports" mapping
# (Caddy reaches the server on the compose network), and start with
#   MSP_BASE_URL=https://rmm.example.com MSP_SECURE_COOKIES=1 MSP_TRUST_PROXY=1 docker compose ... up -d
# or put those three lines in a .env file next to this compose file.
#
# Remote desktop (RD1, docs/OPS.md "Remote desktop (RustDesk)"): the hbbs/hbbr services
# below are the self-hosted RustDesk ID and relay servers. They sit in the "rustdesk"
# profile, so a plain `up -d` never starts them: nothing listens on the RustDesk ports
# until you opt in with
#   MSP_RUSTDESK_HOST=rmm.example.com docker compose -f deploy/docker-compose.yml --profile rustdesk up -d
# After their first start read the public key and put it, with the public hostname, in
# the .env file:
#   cat deploy/rustdesk-data/id_ed25519.pub          # one base64 line
#   MSP_RUSTDESK_HOST=rmm.example.com                 # bare hostname or IP, no port (21116/21117 are the defaults)
#   MSP_RUSTDESK_KEY=<that line>
# then restart the server service, and keep passing --profile rustdesk to every later
# `up`. Firewall: 21115/tcp, 21116/tcp+udp, 21117/tcp inbound (plus 21118/tcp and
# 21119/tcp only for the RustDesk web client).

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: msp-server:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      # Command preset library (the "Presets…" dropdown of the device console). Copy
      # presets.example.json to deploy/presets.json, edit it, mount it and set MSP_PRESETS
      # below; edits are picked up live, no restart needed (docs/OPS.md section 1).
      # - ./presets.json:/data/presets.json:ro
    environment:
      # Absolute URL technicians and agents use to reach the server; printed into the
      # install one-liners next to every enrollment token.
      MSP_BASE_URL: ${MSP_BASE_URL:-http://localhost:8080}
      # 1 when the public URL is https (Caddy or any TLS terminator in front).
      MSP_SECURE_COOKIES: ${MSP_SECURE_COOKIES:-0}
      # 1 only behind a reverse proxy you control: honours the first X-Forwarded-For hop
      # for rate limits and the audit log. Never 1 when :8080 is reachable directly.
      MSP_TRUST_PROXY: ${MSP_TRUST_PROXY:-0}
      MSP_RETENTION_DAYS: ${MSP_RETENTION_DAYS:-7}
      # Uncomment together with the presets.json volume above.
      # MSP_PRESETS: /data/presets.json
      # Remote desktop: both or neither (the server refuses to start with only one, or
      # with a host that is not a bare hostname/IP or a key that is not one base64 line).
      # MSP_RUSTDESK_HOST is the public name of this host as RustDesk clients reach it
      # (the ID server on 21116, the relay on 21117); MSP_RUSTDESK_KEY is the content of
      # ./rustdesk-data/id_ed25519.pub, generated by hbbs on its first start.
      MSP_RUSTDESK_HOST: ${MSP_RUSTDESK_HOST:-}
      MSP_RUSTDESK_KEY: ${MSP_RUSTDESK_KEY:-}

  # RustDesk ID/rendezvous server (hbbs) and relay server (hbbr), self-hosted next to
  # the MSP server (decision D4, phase A). Both are in the "rustdesk" profile: they
  # start only with `--profile rustdesk`, never from a plain `up -d`, because with
  # host networking they bind the RustDesk ports on every interface of the host
  # (there is no port mapping to leave out). Image pinned to the current release
  # (rustdesk/rustdesk-server 1.1.16, 2026-07-20; x86_64-only hosts may pin
  # 1.1.16-amd64). Host networking as in the official compose example: the ports are
  # opened on the host firewall, not mapped here.
  #   hbbs: 21115/tcp (NAT test), 21116/tcp+udp (ID registration, hole punching),
  #         21118/tcp (web client only), 21114/tcp (Pro web console, unused)
  #   hbbr: 21117/tcp (relay), 21119/tcp (web client only)
  # "-r <host>" tells clients which relay to use: the same bare public name as
  # MSP_RUSTDESK_HOST (hbbr listens on 21117 by default, so no port). The command is in
  # list form so the value is always exactly one argument, and the variable has no
  # placeholder default: unset, hbbs gets "-r ''" and advertises no default relay at
  # all (the clients that `msp-agent rustdesk setup` configures carry relay-server
  # themselves) instead of a hostname you do not own. A hard `${VAR:?}` is not used
  # because compose interpolates it even when the profile is inactive and would break
  # the plain `up -d`; the image is FROM scratch, so no entrypoint check is possible
  # either. Keys: hbbs writes id_ed25519 (private, keep it) and id_ed25519.pub
  # (public, goes into MSP_RUSTDESK_KEY and into every client) to /root, bound to
  # ./rustdesk-data. Pass -k <key> (or env KEY) to both to pin a fixed key instead of
  # the generated one.
  hbbs:
    image: rustdesk/rustdesk-server:1.1.16
    container_name: hbbs
    profiles: ["rustdesk"]
    command: ["hbbs", "-r", "${MSP_RUSTDESK_HOST:-}"]
    volumes:
      - ./rustdesk-data:/root
    network_mode: "host"
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:1.1.16
    container_name: hbbr
    profiles: ["rustdesk"]
    command: ["hbbr"]
    volumes:
      - ./rustdesk-data:/root
    network_mode: "host"
    restart: unless-stopped

  # Automatic HTTPS with Let's Encrypt. Requires a public DNS name pointing at this host and
  # ports 80 + 443 reachable from the internet (HTTP-01 challenge). With Caddy in front set
  # MSP_BASE_URL=https://rmm.example.com, MSP_SECURE_COOKIES=1 and MSP_TRUST_PROXY=1 on the
  # server service, and drop the server's "ports" block so only Caddy is exposed.
  #
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - server

